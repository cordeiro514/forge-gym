name = "forge-gim"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Claude model for GIM. Cheaper options: "claude-sonnet-5-5" (half the price), "claude-haiku-5-5" (much cheaper, simpler answers).
MODEL = "claude-opus-5-5"
EFFORT = "medium"
ALLOWED_ORIGINS = "https://cordeiro514.github.io,http://localhost:5173"
# GIM's voice (ElevenLabs). Any voice id from your ElevenLabs voice library works.
# Multilingual v2 sounds best (1 credit per character); "eleven_flash_v2_5" is faster and uses half the credits.
VOICE_ID = "JBFqnCBsd6RMkjVDRZzb"
VOICE_MODEL = "eleven_multilingual_v2"

# Step counts sent by the iPhone Shortcut (created with `npx wrangler kv namespace create STEPS`).
[[kv_namespaces]]
binding = "STEPS"
id = "812b2838c4df4016bb1038f7240ba1d6"
