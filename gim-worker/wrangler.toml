name = "forge-gim"
main = "src/index.js"
compatibility_date = "2026-10-01"

[vars]
# Claude model for GIM. Cheaper options: "claude-sonnet-5-5" (half the price), "claude-haiku-5-5" (much cheaper, simpler answers).
MODEL = "claude-opus-5-5"
EFFORT = "medium"
ALLOWED_ORIGINS = "https://cordeiro514.github.io,http://localhost:5173"

# Step counts sent by the iPhone Shortcut. The id is filled in by `npx wrangler kv namespace create STEPS`.
[[kv_namespaces]]
binding = "STEPS"
id = "REPLACE_WITH_KV_ID"
